# XcodeGen project definition. The .xcodeproj is generated from this file
# (in CI, or with `xcodegen` on a Mac) and is not committed.
name: DroneBoyfriendTracker
options:
  bundleIdPrefix: com.gabrielhcaribe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DroneBoyfriendTracker:
    type: application
    platform: iOS
    sources:
      - path: DroneBoyfriendTracker
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielhcaribe.droneboyfriendtracker
        PRODUCT_NAME: DroneBoyfriendTracker
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/DroneBoyfriendTracker.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        SUPPORTS_MACCATALYST: NO
