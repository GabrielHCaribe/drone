# Compiles the ESP32 firmware with the current Arduino ESP32 core (the same one
# Arduino IDE installs), so a broken build never reaches your board.
name: ESP32 firmware

on:
  push:
    paths: ["firmware/**", "laptop/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      - name: Compile
        run: |
          cp firmware/DroneFC/secrets_template.h firmware/DroneFC/secrets.h
          arduino-cli compile --warnings all -b esp32:esp32:esp32 firmware/DroneFC

  laptop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m py_compile laptop/ground_station.py
